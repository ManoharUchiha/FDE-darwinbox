<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Migration Agent Console</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; margin: 0; background: #0f1115; color: #e6e6e6; }
  header { padding: 16px 24px; background: #161922; border-bottom: 1px solid #2a2e3a; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 18px; margin: 0; }
  button { background: #3b82f6; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button.secondary { background: #374151; }
  button.danger { background: #b91c1c; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 24px; }
  section { background: #161922; border: 1px solid #2a2e3a; border-radius: 8px; padding: 14px; }
  section h2 { font-size: 14px; margin: 0 0 10px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; }
  .full { grid-column: 1 / -1; }
  .log-line { font-family: monospace; font-size: 12px; padding: 3px 0; border-bottom: 1px solid #1f2230; }
  .log-line.warn { color: #fbbf24; }
  .esc-card { border: 1px solid #2a2e3a; border-radius: 6px; padding: 10px; margin-bottom: 8px; background: #10131a; }
  .esc-card .ctx { font-size: 13px; margin-bottom: 8px; }
  .esc-card .meta { font-size: 11px; color: #9ca3af; margin-bottom: 6px; }
  .esc-actions { display: flex; gap: 6px; align-items: center; }
  .esc-actions input { flex: 1; background: #0f1115; border: 1px solid #2a2e3a; color: white; padding: 6px; border-radius: 4px; font-size: 12px; }
  table { width: 100%; font-size: 12px; border-collapse: collapse; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #1f2230; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .pill.success { background: #14532d; color: #86efac; }
  .pill.failure { background: #7f1d1d; color: #fca5a5; }
  .pill.pending { background: #78350f; color: #fcd34d; }
  .scroll { max-height: 320px; overflow-y: auto; }
  .empty { color: #6b7280; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Migration Agent Console — HR/CRM &rarr; Target Schema</h1>
  <div>
    <button id="runBtn" onclick="runAgent()">Run Agent</button>
    <button id="pushBtn" class="secondary" onclick="pushAll()" disabled>Push to Target</button>
  </div>
</header>
<main>
  <section class="full">
    <h2>Agent Activity Log</h2>
    <div id="log" class="scroll"><div class="empty">Click "Run Agent" to start.</div></div>
  </section>

  <section>
    <h2>Escalation Queue (<span id="escCount">0</span> pending)</h2>
    <div id="escalations" class="scroll"><div class="empty">No escalations yet.</div></div>
  </section>

  <section>
    <h2>Clean Records Ready</h2>
    <div id="records" class="scroll"><div class="empty">No records yet.</div></div>
  </section>

  <section class="full">
    <h2>Push Results (Target System)</h2>
    <div id="pushResults" class="scroll"><div class="empty">Not pushed yet.</div></div>
  </section>

  <section class="full">
    <h2>Audit Trail</h2>
    <div id="audit" class="scroll"><div class="empty">No activity yet.</div></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
